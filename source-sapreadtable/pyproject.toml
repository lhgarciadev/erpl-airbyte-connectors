[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "source-sapreadtable"
version = "0.1.1"
description = "Source implementation for reading data directly from SAP tables. Utilizing https://erpl.io."
authors = [
  { name = "Airbyte", email = "contact@airbyte.io" },
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
  "airbyte-cdk==7.5.1",
  "duckdb==0.10.2",
]

[project.scripts]
source-sapreadtable = "source_sapreadtable.run:run"

[project.urls]
Documentation = "https://docs.airbyte.com/integrations/sources/sapreadtable"
Homepage = "https://airbyte.com"
Repository = "https://github.com/airbytehq/airbyte"

[dependency-groups]
dev = [
  "pytest>=7.0",
  "pytest-cov>=4.0",
  "requests-mock>=1.11",
  "pytest-mock>=3.12",
  "ruff>=0.1.0",
  "mypy>=1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["source_sapreadtable"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [".venv", "build", "dist", "*.egg-info", "migrations", ".pytest_cache"]

[tool.ruff.lint]
select = ["F", "E", "W", "I", "N", "UP", "B", "A", "C4", "T20", "PT", "SIM", "RET", "ARG", "ERA"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["unit_tests", "integration_tests"]
filterwarnings = [
  "ignore:.*ExperimentalClassWarning.*:Warning",
  "ignore:This class is experimental. Use at your own risk.:Warning",
]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = false
